name: Release

# 打 tag（如 v0.1.0）时三平台并行构建，产物统一由 action 挂到同名 Release。
# 手动触发也可以，用于验证构建本身没坏（不会上传）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 一台机器交叉出两种架构，避免排队等稀缺的 Intel runner
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # --publish never：只构建不发布。
      # electron-builder 自带的发布会和下面的上传步骤抢同一个 release，
      # 且它默认发 draft，撞上已存在的正式 release 就静默跳过上传（Windows 产物丢失即因此）。
      - name: Build
        run: npm run electron:build -- --publish never ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # 每个 glob 必须独占一行：写成一行多个模式会被当作单个模式，匹配不到带空格的文件名
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.zip
          fail_on_unmatched_files: false
